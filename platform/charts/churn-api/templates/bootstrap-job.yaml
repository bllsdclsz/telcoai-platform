{{- if .Values.bootstrapModel.enabled }}
# Dev only: when the registry has no model registered as @dev yet, download the public
# dataset and train. Training registers the model as @dev only if it passes the quality gate;
# this job never promotes.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "churn.name" . }}-bootstrap-model
  labels: {{- include "churn.labels" . | nindent 4 }}
  annotations:
    # A hook, recreated on every sync: a plain Job's spec is immutable, so an image change
    # would fail the sync. "Sync" (not PostSync): the API only turns healthy after this runs.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "churn.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap-model
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: {{ include "churn.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: CHURN_MLFLOW_TRACKING_URI, value: {{ .Values.registry.url | quote }} }
            - { name: CHURN_DATA_DIR, value: /tmp/data }
            - { name: HOME, value: /tmp }
            - { name: MLFLOW_TRACKING_URI, value: {{ .Values.registry.url | quote }} }
            - { name: MLFLOW_DISABLE_AGENT_HINT, value: "1" }
          command: [sh, -c]
          args:
            - >-
              until python -c "import urllib.request; urllib.request.urlopen('{{ .Values.registry.url }}/health')";
              do echo waiting for the registry; sleep 5; done;
              if python -c "from mlflow import MlflowClient; MlflowClient().get_model_version_by_alias('{{ .Values.registry.modelName }}', 'dev')" 2>/dev/null;
              then echo "a model is already registered as @dev, nothing to do"; exit 0; fi;
              churn download && churn train
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
{{- end }}
