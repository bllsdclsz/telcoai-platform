# Rule files and dashboards live as plain files in files/, so promtool can check and unit-test
# the rules (tests/) exactly as Prometheus loads them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.rulesConfigMap }}
  labels: { app.kubernetes.io/part-of: telcoai-monitoring }
data:
{{ (.Files.Glob "files/rules/*.yaml").AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.dashboardsConfigMap }}
  labels: { app.kubernetes.io/part-of: telcoai-monitoring }
data:
{{ (.Files.Glob "files/dashboards/*.json").AsConfig | indent 2 }}
