{{- if .Values.bootstrapModel.enabled }}
{{- if not .Values.bootstrapModel.approvedBy }}
{{- fail "bootstrapModel.approvedBy is required: promotions to prod always carry a named approver" }}
{{- end }}
# Dev only: download the public dataset, train (the quality gate still applies), and promote
# the result to the serving alias, so a fresh environment serves a model.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "churn.name" . }}-bootstrap-model
  labels: {{- include "churn.labels" . | nindent 4 }}
  annotations:
    # A hook, recreated on every sync: a plain Job's spec is immutable, so an image change
    # would fail the sync. "Sync" (not PostSync): the API only turns healthy after this runs.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "churn.labels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap-model
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: CHURN_MLFLOW_TRACKING_URI, value: {{ include "churn.mlflowUrl" . | quote }} }
            - { name: CHURN_DATA_DIR, value: /tmp/data }
            - { name: HOME, value: /tmp }
            - { name: MLFLOW_TRACKING_URI, value: {{ include "churn.mlflowUrl" . | quote }} }
            - { name: MLFLOW_DISABLE_AGENT_HINT, value: "1" }
          command: [sh, -c]
          args:
            - >-
              until python -c "import urllib.request; urllib.request.urlopen('{{ include "churn.mlflowUrl" . }}/health')";
              do echo waiting for mlflow; sleep 5; done;
              if python -c "from mlflow import MlflowClient; MlflowClient().get_model_version_by_alias('{{ .Values.bootstrapModel.modelName }}', '{{ .Values.api.servingAlias }}')" 2>/dev/null;
              then echo "{{ .Values.api.servingAlias }} alias already set, nothing to do"; exit 0; fi;
              churn download && churn train &&
              churn promote --from dev --to {{ .Values.api.servingAlias }}
              --approved-by {{ .Values.bootstrapModel.approvedBy | quote }} --fairness-reviewed
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
{{- end }}
