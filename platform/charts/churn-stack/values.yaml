# Defaults; each environment overrides them in platform/gitops/envs/<env>/churn-stack.yaml.

image:
  repository: ghcr.io/bllsdclsz/telco-churn-api
  tag: main
  pullPolicy: IfNotPresent

api:
  replicas: 1
  servingAlias: prod # the API only ever serves the model behind this registry alias
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

mlflow:
  image: ghcr.io/mlflow/mlflow:v3.16.1
  storage: 2Gi
  workers: 2 # uvicorn workers; the default 4 is too many for a small registry
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: "1", memory: 1Gi }

# Dev only: train a model and promote it, so a fresh environment serves something. In test and
# prod, models reach the "prod" alias only through the human-approved promotion (churn promote).
bootstrapModel:
  enabled: false
  approvedBy: ""
  modelName: telco-churn # skip the job when this model already has the serving alias

ingress:
  enabled: false
  host: churn.localhost
