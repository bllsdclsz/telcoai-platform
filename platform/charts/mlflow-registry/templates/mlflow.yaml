apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "registry.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate } # single writer on a ReadWriteOnce volume
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "registry.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mlflow
          image: {{ .Values.image }}
          args:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=/mlflow/artifacts
            - --allowed-hosts={{ include "registry.hosts" . }}
            - --workers={{ .Values.workers }}
          env:
            # The GenAI job runner (scorers, judges) starts 8 more Python processes: 1.8 GiB in
            # total instead of 0.6 GiB. A model registry does not use it.
            - { name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION, value: "false" }
          ports: [{ name: http, containerPort: 5000 }]
          # Startup (DB migrations, workers) can take a minute under a CPU limit: liveness only
          # starts once the startup probe passed, so a slow start is never killed as a hang.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /mlflow }]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "registry.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ name: http, port: 5000, targetPort: http }]
