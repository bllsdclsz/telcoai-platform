category: contract
updated: 2026-05-20
translations:
  en:
    title: Keeping your number when switching provider
    body: |
      You can keep your mobile number when you switch provider. Your new provider requests the porting with the authorisation form you sign; you do not need to cancel your old contract yourself, because it ends automatically on the porting date.

      Porting your number to Nordalp is free of charge and takes 3 to 5 working days. Your old SIM card keeps working until the switch.

      Please note: remaining prepaid credit with your old provider is lost when the number is ported.
  de:
    title: Nummer beim Anbieterwechsel behalten
    body: |
      Sie können Ihre Handynummer beim Anbieterwechsel behalten. Ihr neuer Anbieter beantragt die Portierung mit dem Vollmachtsformular, das Sie unterschreiben; Sie müssen Ihren alten Vertrag nicht selbst kündigen, denn er endet automatisch am Portierungsdatum.

      Die Portierung Ihrer Nummer zu Nordalp ist kostenlos und dauert 3 bis 5 Arbeitstage. Ihre alte SIM-Karte funktioniert bis zum Wechsel weiter.

      Bitte beachten Sie: Restliches Prepaid-Guthaben beim alten Anbieter verfällt bei der Portierung.
  fr:
    title: Garder votre numéro en changeant d'opérateur
    body: |
      Vous pouvez garder votre numéro de mobile en changeant d'opérateur. Votre nouvel opérateur demande le portage avec le formulaire de procuration que vous signez ; vous n'avez pas besoin de résilier vous-même votre ancien contrat, car il prend fin automatiquement à la date du portage.

      Le portage de votre numéro vers Nordalp est gratuit et prend 3 à 5 jours ouvrables. Votre ancienne carte SIM fonctionne jusqu'au changement.

      Attention : le crédit prépayé restant chez votre ancien opérateur est perdu lors du portage.
  it:
    title: Mantenere il numero cambiando operatore
    body: |
      Puoi mantenere il tuo numero di cellulare quando cambi operatore. Il nuovo operatore richiede la portabilità con il modulo di procura che firmi; non devi disdire tu il vecchio contratto, perché termina automaticamente alla data della portabilità.

      La portabilità del numero verso Nordalp è gratuita e richiede da 3 a 5 giorni lavorativi. La vecchia SIM continua a funzionare fino al passaggio.

      Attenzione: il credito prepagato residuo presso il vecchio operatore va perso con la portabilità.
