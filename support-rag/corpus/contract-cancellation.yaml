category: contract
updated: 2026-05-20
translations:
  en:
    title: Cancelling your contract
    body: |
      Depending on your offer, the minimum contract term is 12 or 24 months. After it, you can cancel with 2 months' notice to the end of any month.

      If you cancel before the minimum term ends, the remaining monthly base fees until the end of the minimum term are charged, up to a maximum of CHF 500.

      You can cancel with the online form in the app (My account > Contract > Cancel), by letter or in a Nordalp shop. You receive a written confirmation within 5 working days. If you move to another provider and keep your number, do not cancel yourself: the porting ends the contract automatically.
  de:
    title: Vertrag kündigen
    body: |
      Je nach Angebot beträgt die Mindestvertragsdauer 12 oder 24 Monate. Danach können Sie mit einer Frist von 2 Monaten auf das Ende jedes Monats kündigen.

      Kündigen Sie vor Ablauf der Mindestdauer, werden die restlichen monatlichen Grundgebühren bis zum Ende der Mindestdauer verrechnet, höchstens jedoch CHF 500.

      Sie können über das Online-Formular in der App (Mein Konto > Vertrag > Kündigen), per Brief oder im Nordalp-Shop kündigen. Sie erhalten innert 5 Arbeitstagen eine schriftliche Bestätigung. Wechseln Sie zu einem anderen Anbieter und behalten Ihre Nummer, kündigen Sie nicht selbst: Die Portierung beendet den Vertrag automatisch.
  fr:
    title: Résilier votre contrat
    body: |
      Selon l'offre, la durée minimale du contrat est de 12 ou 24 mois. Ensuite, vous pouvez résilier moyennant un préavis de 2 mois pour la fin de chaque mois.

      Si vous résiliez avant la fin de la durée minimale, les taxes de base mensuelles restantes jusqu'à la fin de la durée minimale sont facturées, au maximum CHF 500.

      Vous pouvez résilier via le formulaire en ligne dans l'app (Mon compte > Contrat > Résilier), par lettre ou dans un shop Nordalp. Vous recevez une confirmation écrite dans les 5 jours ouvrables. Si vous changez d'opérateur en gardant votre numéro, ne résiliez pas vous-même : le portage met fin au contrat automatiquement.
  it:
    title: Disdire il contratto
    body: |
      A seconda dell'offerta, la durata minima del contratto è di 12 o 24 mesi. Dopo questo periodo puoi disdire con un preavviso di 2 mesi per la fine di ogni mese.

      Se disdici prima della fine della durata minima, vengono addebitati i canoni base mensili restanti fino alla fine della durata minima, al massimo CHF 500.

      Puoi disdire con il modulo online nell'app (Il mio conto > Contratto > Disdici), per lettera o in un negozio Nordalp. Ricevi una conferma scritta entro 5 giorni lavorativi. Se passi a un altro operatore mantenendo il numero, non disdire tu stesso: la portabilità termina il contratto automaticamente.
