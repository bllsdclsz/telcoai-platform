category: tv
updated: 2026-07-15
translations:
  en:
    title: Nordalp TV features
    body: |
      With Nordalp TV you can watch programmes up to 7 days after broadcast on more than 250 channels with Replay. Recordings are stored in the cloud, with up to 500 hours of space.

      You can use the Nordalp TV app on up to 5 devices and watch on 2 of them at the same time.

      If the TV box freezes, press and hold the power button for 10 seconds to restart it.
  de:
    title: Funktionen von Nordalp TV
    body: |
      Mit Nordalp TV sehen Sie dank Replay Sendungen bis 7 Tage nach der Ausstrahlung auf über 250 Sendern. Aufnahmen werden in der Cloud gespeichert, mit bis zu 500 Stunden Speicherplatz.

      Die Nordalp-TV-App können Sie auf bis zu 5 Geräten nutzen und auf 2 davon gleichzeitig schauen.

      Friert die TV-Box ein, halten Sie die Ein/Aus-Taste 10 Sekunden gedrückt, um sie neu zu starten.
  fr:
    title: Fonctions de Nordalp TV
    body: |
      Avec Nordalp TV, Replay vous permet de regarder les émissions jusqu'à 7 jours après leur diffusion sur plus de 250 chaînes. Les enregistrements sont stockés dans le cloud, avec jusqu'à 500 heures d'espace.

      Vous pouvez utiliser l'app Nordalp TV sur 5 appareils au maximum et regarder sur 2 d'entre eux en même temps.

      Si la TV-Box se bloque, maintenez le bouton marche/arrêt enfoncé pendant 10 secondes pour la redémarrer.
  it:
    title: Funzioni di Nordalp TV
    body: |
      Con Nordalp TV e la funzione Replay puoi guardare i programmi fino a 7 giorni dopo la messa in onda su oltre 250 canali. Le registrazioni sono salvate nel cloud, con fino a 500 ore di spazio.

      Puoi usare l'app Nordalp TV su un massimo di 5 dispositivi e guardare su 2 di essi contemporaneamente.

      Se la TV-Box si blocca, tieni premuto il tasto di accensione per 10 secondi per riavviarla.
