category: roaming
updated: 2026-09-01
translations:
  en:
    title: Roaming in the EU/EEA and the UK
    body: |
      The Swiss+ and Swiss Max plans include roaming in all EU/EEA countries and the UK: 5 GB of mobile data per month, plus unlimited calls and SMS within these countries and back to Switzerland.

      Once the 5 GB are used up, data continues at a reduced speed of 128 kbit/s until the next billing month. Swiss Basic includes no roaming: you can buy a Europe Day Pass for CHF 5 per day with 200 MB.

      Roaming is switched on by default. To switch it off, open the Nordalp app and go to Settings > Roaming.
  de:
    title: Roaming in der EU/EWR und in Grossbritannien
    body: |
      Die Abos Swiss+ und Swiss Max enthalten Roaming in allen Ländern der EU/EWR und in Grossbritannien: 5 GB mobile Daten pro Monat sowie unbegrenzte Anrufe und SMS innerhalb dieser Länder und in die Schweiz.

      Sind die 5 GB aufgebraucht, surfen Sie mit reduzierter Geschwindigkeit von 128 kbit/s bis zum nächsten Abrechnungsmonat weiter. Swiss Basic enthält kein Roaming: Sie können einen Europa-Tagespass für CHF 5 pro Tag mit 200 MB kaufen.

      Roaming ist standardmässig eingeschaltet. Zum Ausschalten öffnen Sie die Nordalp-App und gehen zu Einstellungen > Roaming.
  fr:
    title: Roaming dans l'UE/EEE et au Royaume-Uni
    body: |
      Les abonnements Swiss+ et Swiss Max incluent le roaming dans tous les pays de l'UE/EEE et au Royaume-Uni : 5 Go de données mobiles par mois, ainsi que les appels et SMS illimités dans ces pays et vers la Suisse.

      Une fois les 5 Go épuisés, la connexion continue à un débit réduit de 128 kbit/s jusqu'au mois de facturation suivant. Swiss Basic n'inclut pas de roaming : vous pouvez acheter un Pass Journée Europe à CHF 5 par jour avec 200 Mo.

      Le roaming est activé par défaut. Pour le désactiver, ouvrez l'app Nordalp et allez dans Réglages > Roaming.
  it:
    title: Roaming nell'UE/SEE e nel Regno Unito
    body: |
      Gli abbonamenti Swiss+ e Swiss Max includono il roaming in tutti i paesi dell'UE/SEE e nel Regno Unito: 5 GB di dati mobili al mese, oltre a chiamate e SMS illimitati all'interno di questi paesi e verso la Svizzera.

      Esauriti i 5 GB, la navigazione continua a velocità ridotta di 128 kbit/s fino al mese di fatturazione successivo. Swiss Basic non include il roaming: puoi acquistare un Pass Giornaliero Europa a CHF 5 al giorno con 200 MB.

      Il roaming è attivo per impostazione predefinita. Per disattivarlo, apri l'app Nordalp e vai su Impostazioni > Roaming.
