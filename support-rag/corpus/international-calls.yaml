category: mobile
updated: 2026-06-01
translations:
  en:
    title: Calling abroad from Switzerland
    body: |
      Calls from Switzerland to foreign numbers are charged per minute: CHF 0.50 to Zone 1 (Europe), CHF 1.00 to Zone 2 (USA, Canada, Turkey) and CHF 2.00 to Zone 3 (all other countries). An SMS to a foreign number costs CHF 0.20.

      If you call abroad often, the World 200 option is worth it: for CHF 15 per month it includes 200 minutes to Zone 1 and Zone 2. Activate it in the app under My account > Options.
  de:
    title: Aus der Schweiz ins Ausland telefonieren
    body: |
      Anrufe aus der Schweiz auf ausländische Nummern werden pro Minute verrechnet: CHF 0.50 in Zone 1 (Europa), CHF 1.00 in Zone 2 (USA, Kanada, Türkei) und CHF 2.00 in Zone 3 (alle übrigen Länder). Eine SMS an eine ausländische Nummer kostet CHF 0.20.

      Telefonieren Sie oft ins Ausland, lohnt sich die Option World 200: Für CHF 15 pro Monat enthält sie 200 Minuten in Zone 1 und Zone 2. Aktivieren Sie sie in der App unter Mein Konto > Optionen.
  fr:
    title: Appeler l'étranger depuis la Suisse
    body: |
      Les appels depuis la Suisse vers des numéros étrangers sont facturés à la minute : CHF 0.50 vers la zone 1 (Europe), CHF 1.00 vers la zone 2 (États-Unis, Canada, Turquie) et CHF 2.00 vers la zone 3 (tous les autres pays). Un SMS vers un numéro étranger coûte CHF 0.20.

      Si vous appelez souvent l'étranger, l'option World 200 est avantageuse : pour CHF 15 par mois, elle inclut 200 minutes vers les zones 1 et 2. Activez-la dans l'app sous Mon compte > Options.
  it:
    title: Chiamare l'estero dalla Svizzera
    body: |
      Le chiamate dalla Svizzera verso numeri esteri sono addebitate al minuto: CHF 0.50 verso la zona 1 (Europa), CHF 1.00 verso la zona 2 (Stati Uniti, Canada, Turchia) e CHF 2.00 verso la zona 3 (tutti gli altri paesi). Un SMS verso un numero estero costa CHF 0.20.

      Se chiami spesso all'estero conviene l'opzione World 200: per CHF 15 al mese include 200 minuti verso le zone 1 e 2. Attivala nell'app in Il mio conto > Opzioni.
