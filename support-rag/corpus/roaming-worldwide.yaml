category: roaming
updated: 2026-09-01
translations:
  en:
    title: Travelling outside Europe
    body: |
      Outside Europe, countries are grouped into zones. Zone 2 covers the USA, Canada and Turkey; Zone 3 covers all other countries.

      Travel packs are the cheapest option: Zone 2 pack with 3 GB for 30 days costs CHF 29, Zone 3 pack with 1 GB for 30 days costs CHF 39. Book them in the app under Roaming > Travel packs before you leave.

      Without a pack, data costs CHF 9.90 per 100 MB and calls in Zone 2 cost CHF 1.50 per minute. To protect you from bill shocks, data abroad is blocked once CHF 50 per month is reached; you receive an SMS and can raise the limit in the app.
  de:
    title: Reisen ausserhalb Europas
    body: |
      Ausserhalb Europas sind die Länder in Zonen eingeteilt. Zone 2 umfasst die USA, Kanada und die Türkei; Zone 3 umfasst alle übrigen Länder.

      Reisepakete sind die günstigste Option: Das Zone-2-Paket mit 3 GB für 30 Tage kostet CHF 29, das Zone-3-Paket mit 1 GB für 30 Tage kostet CHF 39. Buchen Sie es vor der Abreise in der App unter Roaming > Reisepakete.

      Ohne Paket kosten Daten CHF 9.90 pro 100 MB und Anrufe in Zone 2 CHF 1.50 pro Minute. Zum Schutz vor hohen Rechnungen werden Daten im Ausland gesperrt, sobald CHF 50 pro Monat erreicht sind; Sie erhalten eine SMS und können die Limite in der App erhöhen.
  fr:
    title: Voyager hors d'Europe
    body: |
      Hors d'Europe, les pays sont répartis en zones. La zone 2 comprend les États-Unis, le Canada et la Turquie ; la zone 3 comprend tous les autres pays.

      Les packs voyage sont l'option la plus avantageuse : le pack zone 2 avec 3 Go pour 30 jours coûte CHF 29, le pack zone 3 avec 1 Go pour 30 jours coûte CHF 39. Réservez-le avant votre départ dans l'app sous Roaming > Packs voyage.

      Sans pack, les données coûtent CHF 9.90 par 100 Mo et les appels en zone 2 CHF 1.50 par minute. Pour éviter les mauvaises surprises, les données à l'étranger sont bloquées dès que CHF 50 par mois sont atteints ; vous recevez un SMS et pouvez augmenter la limite dans l'app.
  it:
    title: Viaggiare fuori dall'Europa
    body: |
      Fuori dall'Europa i paesi sono suddivisi in zone. La zona 2 comprende Stati Uniti, Canada e Turchia; la zona 3 comprende tutti gli altri paesi.

      I pacchetti viaggio sono l'opzione più conveniente: il pacchetto zona 2 con 3 GB per 30 giorni costa CHF 29, il pacchetto zona 3 con 1 GB per 30 giorni costa CHF 39. Prenotalo prima della partenza nell'app in Roaming > Pacchetti viaggio.

      Senza pacchetto, i dati costano CHF 9.90 ogni 100 MB e le chiamate nella zona 2 CHF 1.50 al minuto. Per proteggerti da fatture elevate, i dati all'estero vengono bloccati al raggiungimento di CHF 50 al mese; ricevi un SMS e puoi aumentare il limite nell'app.
