category: mobile
updated: 2026-07-10
translations:
  en:
    title: Lost or stolen phone or SIM card
    body: |
      Block your SIM card immediately so nobody can use it at your expense. You can do this 24/7 in the Nordalp app under My account > SIM > Block, or by calling the free hotline 0800 700 700.

      A replacement SIM card costs CHF 40 and arrives by post within 2 working days. In a Nordalp shop you get it immediately if you bring an official ID. A replacement eSIM costs CHF 10. Your number stays the same.

      If your phone was stolen, report it to the police as well; your insurance usually asks for the police report.
  de:
    title: Handy oder SIM-Karte verloren oder gestohlen
    body: |
      Sperren Sie Ihre SIM-Karte sofort, damit niemand sie auf Ihre Kosten nutzen kann. Das geht rund um die Uhr in der Nordalp-App unter Mein Konto > SIM > Sperren oder über die Gratis-Hotline 0800 700 700.

      Eine Ersatz-SIM kostet CHF 40 und kommt innert 2 Arbeitstagen per Post. Im Nordalp-Shop erhalten Sie sie sofort gegen Vorlage eines amtlichen Ausweises. Eine Ersatz-eSIM kostet CHF 10. Ihre Nummer bleibt gleich.

      Wurde Ihr Handy gestohlen, melden Sie es zusätzlich der Polizei; Ihre Versicherung verlangt meist den Polizeirapport.
  fr:
    title: Téléphone ou carte SIM perdu ou volé
    body: |
      Bloquez immédiatement votre carte SIM afin que personne ne puisse l'utiliser à vos frais. C'est possible 24 h/24 dans l'app Nordalp sous Mon compte > SIM > Bloquer, ou via la hotline gratuite 0800 700 700.

      Une carte SIM de remplacement coûte CHF 40 et arrive par la poste en 2 jours ouvrables. Dans un shop Nordalp, vous la recevez immédiatement sur présentation d'une pièce d'identité officielle. Une eSIM de remplacement coûte CHF 10. Votre numéro reste le même.

      Si votre téléphone a été volé, signalez-le aussi à la police ; votre assurance demande généralement le rapport de police.
  it:
    title: Telefono o SIM persi o rubati
    body: |
      Blocca subito la tua SIM, così nessuno può usarla a tue spese. Puoi farlo 24 ore su 24 nell'app Nordalp in Il mio conto > SIM > Blocca, oppure chiamando la hotline gratuita 0800 700 700.

      Una SIM sostitutiva costa CHF 40 e arriva per posta entro 2 giorni lavorativi. In un negozio Nordalp la ricevi subito presentando un documento d'identità ufficiale. Una eSIM sostitutiva costa CHF 10. Il tuo numero resta invariato.

      Se il telefono è stato rubato, denuncia il furto anche alla polizia; di solito l'assicurazione richiede il verbale di polizia.
