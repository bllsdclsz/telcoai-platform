category: mobile
updated: 2026-07-10
translations:
  en:
    title: Device repair and warranty
    body: |
      Devices bought from Nordalp have a 2-year manufacturer warranty from the purchase date. Bring the device with the receipt to a Nordalp shop, or send it in with the free repair envelope ordered in the app.

      A repair takes about 10 working days. On request you get a loan phone free of charge for the duration of the repair.

      Damage caused by falls, water or opening the device is not covered by the warranty. A quote for such repairs costs CHF 49, which is deducted if you accept the repair.
  de:
    title: Gerätereparatur und Garantie
    body: |
      Bei Nordalp gekaufte Geräte haben ab Kaufdatum 2 Jahre Herstellergarantie. Bringen Sie das Gerät mit dem Kaufbeleg in einen Nordalp-Shop oder senden Sie es mit dem in der App bestellten kostenlosen Reparaturcouvert ein.

      Eine Reparatur dauert etwa 10 Arbeitstage. Auf Wunsch erhalten Sie für die Dauer der Reparatur kostenlos ein Ersatzhandy.

      Schäden durch Stürze, Wasser oder Öffnen des Geräts sind nicht durch die Garantie gedeckt. Ein Kostenvoranschlag für solche Reparaturen kostet CHF 49 und wird angerechnet, wenn Sie die Reparatur annehmen.
  fr:
    title: Réparation et garantie des appareils
    body: |
      Les appareils achetés chez Nordalp bénéficient d'une garantie constructeur de 2 ans à partir de la date d'achat. Apportez l'appareil avec le justificatif d'achat dans un shop Nordalp, ou envoyez-le avec l'enveloppe de réparation gratuite commandée dans l'app.

      Une réparation dure environ 10 jours ouvrables. Sur demande, vous recevez gratuitement un téléphone de prêt pendant la réparation.

      Les dommages dus à une chute, à l'eau ou à l'ouverture de l'appareil ne sont pas couverts par la garantie. Un devis pour ce type de réparation coûte CHF 49, déduits si vous acceptez la réparation.
  it:
    title: Riparazione e garanzia dei dispositivi
    body: |
      I dispositivi acquistati da Nordalp hanno una garanzia del produttore di 2 anni dalla data d'acquisto. Porta il dispositivo con lo scontrino in un negozio Nordalp, oppure spediscilo con la busta di riparazione gratuita ordinata nell'app.

      Una riparazione dura circa 10 giorni lavorativi. Su richiesta ricevi gratuitamente un telefono sostitutivo per la durata della riparazione.

      I danni causati da cadute, acqua o apertura del dispositivo non sono coperti dalla garanzia. Un preventivo per queste riparazioni costa CHF 49, che vengono dedotti se accetti la riparazione.
