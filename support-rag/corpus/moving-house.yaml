category: internet
updated: 2026-08-01
translations:
  en:
    title: Moving house
    body: |
      Tell us about your move at least 4 weeks in advance, in the app under My services > Move. We check the availability of Nordalp Internet at your new address.

      If a technician has to install the connection at the new address, the visit costs CHF 99. Take your Internet-Box and TV box with you.

      If Nordalp Internet is not available at your new address, you can cancel your internet subscription without an early termination fee, with proof of your new address.
  de:
    title: Umzug
    body: |
      Melden Sie uns Ihren Umzug mindestens 4 Wochen im Voraus in der App unter Meine Dienste > Umzug. Wir prüfen die Verfügbarkeit von Nordalp Internet an Ihrer neuen Adresse.

      Muss ein Techniker den Anschluss an der neuen Adresse installieren, kostet der Einsatz CHF 99. Nehmen Sie Ihre Internet-Box und TV-Box mit.

      Ist Nordalp Internet an Ihrer neuen Adresse nicht verfügbar, können Sie Ihr Internet-Abo mit einem Nachweis der neuen Adresse ohne Gebühr für vorzeitige Kündigung beenden.
  fr:
    title: Déménagement
    body: |
      Annoncez-nous votre déménagement au moins 4 semaines à l'avance dans l'app sous Mes services > Déménagement. Nous vérifions la disponibilité de Nordalp Internet à votre nouvelle adresse.

      Si un technicien doit installer le raccordement à la nouvelle adresse, l'intervention coûte CHF 99. Emportez votre Internet-Box et votre TV-Box.

      Si Nordalp Internet n'est pas disponible à votre nouvelle adresse, vous pouvez résilier votre abonnement Internet sans frais de résiliation anticipée, avec un justificatif de votre nouvelle adresse.
  it:
    title: Trasloco
    body: |
      Comunicaci il trasloco almeno 4 settimane prima nell'app in I miei servizi > Trasloco. Verifichiamo la disponibilità di Nordalp Internet al tuo nuovo indirizzo.

      Se un tecnico deve installare l'allacciamento al nuovo indirizzo, l'intervento costa CHF 99. Porta con te la Internet-Box e la TV-Box.

      Se Nordalp Internet non è disponibile al nuovo indirizzo, puoi disdire l'abbonamento Internet senza tassa di disdetta anticipata, presentando un documento che attesti il nuovo indirizzo.
