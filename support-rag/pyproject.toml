[project]
name = "support-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bllsdclsz", email = "51716990+bllsdclsz@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "litellm>=1.103.0",
    "mlflow>=3.16.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag = "support_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
