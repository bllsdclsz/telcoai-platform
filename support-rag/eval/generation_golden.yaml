# Answer-quality evaluation: `rag eval-generation`.
# expect: answer -> the reply must contain every fact (alternatives separated by "|"), cite a
#                   source and be in the question's language;
# expect: decline -> the help center does not cover it: the assistant must not answer.
# Facts are checked against the corpus in support-rag/corpus.

# --- German
- {
    q: "Mir wurde das Handy im Zug gestohlen. Was kostet eine neue SIM?",
    lang: de,
    expect: answer,
    facts: ["40"],
  }
- {
    q: "Wie lange dauert es, meine Nummer zu Nordalp mitzunehmen?",
    lang: de,
    expect: answer,
    facts: ["3", "5"],
  }
- {
    q: "Wie viel kostet die Papierrechnung?",
    lang: de,
    expect: answer,
    facts: ["3.50|3,50"],
  }
- {
    q: "Was kostet die zweite Mahnung?",
    lang: de,
    expect: answer,
    facts: ["30"],
  }
- {
    q: "Wie lange ist der Link zum Zurücksetzen des Passworts gültig?",
    lang: de,
    expect: answer,
    facts: ["1 Stunde|eine Stunde"],
  }
- {
    q: "Wie viele Stunden Aufnahmen kann ich mit Nordalp TV speichern?",
    lang: de,
    expect: answer,
    facts: ["500"],
  }
