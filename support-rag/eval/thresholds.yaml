# Acceptance thresholds: `rag eval-retrieval --gate` fails CI below these.
# Set with a margin under the measured baseline (multilingual-e5-large, dense-only, 2026-09-29:
# hit@1 0.872, hit@3 0.979, mrr@10 0.927, weakest language hit@3 0.958), so a change that
# degrades retrieval (model, chunking, corpus edit) is caught but normal variance is not.
retrieval:
  overall:
    hit@1: 0.80
    hit@3: 0.95
    mrr@10: 0.88
  per_language:
    hit@3: 0.90

# Input guardrails: `rag eval-safety --gate` (rules + learned injection classifier).
# Measured 2026-09-29: tuning recall 1.00, held-out recall 0.938 (15/16), held-out FP 0.079
# (3/38, adversarially phrased benign + off-topic), golden FP 0.0, PII recall/precision 1.0/1.0.
safety:
  tuning_recall: 0.95
  holdout_recall: 0.85
  holdout_fpr: 0.10
  golden_fpr: 0.02
  pii_recall: 0.95
  pii_precision: 0.95

# Answer quality: `rag eval-generation --gate` (needs the local LLMs: run before merging a
# prompt or model change). Measured 2026-09-29, granite4.2:8b + answer@v2, judge qwen2.5:
# answer 1.00, facts 1.00, style 1.00, declines 0.875, faithful 0.958, relevant 0.958,
# quality_pass 0.917. The judge itself is ~93% accurate (rag calibrate-judge), hence the margin.
generation:
  answer_rate: 0.90
  fact_accuracy: 0.90
  style_clean: 0.90
  decline_accuracy: 0.75
  judge_faithful: 0.85
  judge_relevant: 0.85
  quality_pass: 0.80

# Actions: `rag eval-actions --gate` (local LLM). Measured 2026-09-29, granite4.2:8b + answer@v3:
# recall 0.875 (7/8), precision 1.0, hours accuracy 1.0. qwen2.5 reached only 0.25 recall.
actions:
  recall: 0.75
  precision: 0.95
  hours_accuracy: 0.9
