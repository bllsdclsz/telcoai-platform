name: telcoai

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  churn-api:
    build:
      context: .
      dockerfile: churn/Dockerfile
    image: telco-churn-api:local
    environment:
      CHURN_MLFLOW_TRACKING_URI: http://mlflow:5000
      CHURN_SERVING_ALIAS: ${CHURN_SERVING_ALIAS:-prod}
    ports: ["8000:8000"]
    depends_on:
      mlflow:
        condition: service_healthy
    # Needs a model behind the serving alias: run `make train promote` first.
    profiles: [serve]

volumes:
  mlflow-data:
