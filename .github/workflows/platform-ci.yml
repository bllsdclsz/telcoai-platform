name: platform-ci

on:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install kubeconform
        run: |
          curl -sSfL -o kc.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate every chart, environment and Argo CD app
        run: sh platform/scripts/validate-manifests.sh
      - name: Charts refuse to render without an image tag
        run: |
          ! helm template churn platform/charts/churn-api 2>/dev/null
      - name: Monitoring charts render with our values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm template prometheus prometheus-community/prometheus --version 29.35.0 \
            -n telcoai-monitoring -f platform/monitoring/prometheus-values.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.35.0
          helm template grafana grafana-community/grafana --version 13.2.7 \
            -n telcoai-monitoring -f platform/monitoring/grafana-values.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.35.0

  # SLO rules: valid, and the alerts fire (or stay silent) exactly as the unit tests expect.
  slo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool check and test
        run: >
          docker run --rm -v "$PWD/platform/charts/slo:/c:ro" -w /c/tests --entrypoint sh
          prom/prometheus:v3.15.0 -c 'promtool check rules ../files/rules/*.yaml && promtool test rules *.test.yaml'
      - name: Dashboards are valid JSON
        run: for f in platform/charts/slo/files/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done

  # Test and prod pin immutable tags that exist; prod only runs what has been in test.
  promotions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the "has been in test" rule reads the history of the test values
      - run: sh platform/scripts/check-promotions.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
