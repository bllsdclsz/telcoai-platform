name: support-rag-ci

on:
  push:
    branches: [main]
    paths:
      [
        "support-rag/**",
        "pyproject.toml",
        "uv.lock",
        ".github/workflows/support-rag-ci.yml",
      ]
  pull_request:
    paths:
      [
        "support-rag/**",
        "pyproject.toml",
        "uv.lock",
        ".github/workflows/support-rag-ci.yml",
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
  HF_HUB_DISABLE_SYMLINKS: "1"  # see support_rag/embeddings.py

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check support-rag
          uv run ruff format --check support-rag
      - name: Type check
        run: uv run mypy support-rag/src
      - name: Test
        run: uv run pytest -p no:warnings support-rag/tests

  # Evaluation gate: real embedding model on the golden questions; fails below eval/thresholds.yaml.
  retrieval-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Cache embedding models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-v2-${{ hashFiles('support-rag/src/support_rag/config.py') }}
      - run: uv sync --locked
      - name: Retrieval evaluation gate
        run: uv run rag eval-retrieval --gate --report retrieval-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-report
          path: retrieval-report.json
