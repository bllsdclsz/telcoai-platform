name: churn-ci

on:
  push:
    branches: [main]
    paths:
      [
        "churn/**",
        "monitoring/**",
        "pyproject.toml",
        "uv.lock",
        ".github/workflows/churn-ci.yml",
      ]
  pull_request:
    paths:
      [
        "churn/**",
        "monitoring/**",
        "pyproject.toml",
        "uv.lock",
        ".github/workflows/churn-ci.yml",
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy churn/src
      - name: Test
        run: uv run pytest -p no:warnings

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: churn/Dockerfile
          push: false
          tags: telco-churn-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Prometheus rules
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint sh
          prom/prometheus:v3.15.0 -c 'promtool check rules /p/rules/*.yml'
      - name: Validate Grafana dashboards are JSON
        run: for f in monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done
